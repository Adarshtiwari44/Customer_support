[project]
name = "customer-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adarsh Tiwari", email = "adarshtiwari1979@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu==1.9.0",
    "fastapi==0.115.0",
    "groq==0.12.0",
    "httpx==0.27.2",
    "langchain-core==0.3.15",
    "langchain-groq==0.2.1",
    "langdetect>=1.0.9",
    "langgraph==0.2.45",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "pytest==8.3.3",
    "python-dotenv==1.0.1",
    "scikit-learn==1.5.2",
    "sentence-transformers==3.2.1",
    "uvicorn[standard]==0.32.0",
]

[project.scripts]
customer-support = "customer_support:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
]
