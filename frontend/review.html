<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalation Review & Human Support Dashboard</title>
    <link rel="stylesheet" href="static/review.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚨 Human Support & Escalation Dashboard</h1>
            <div class="stats" id="stats">
                <span class="stat-badge">Pending Escalations: <strong id="pending-count">0</strong></span>
                <span class="stat-badge">Approved / Active: <strong id="approved-count">0</strong></span>
                <span class="stat-badge">Rejected: <strong id="rejected-count">0</strong></span>
            </div>
            <button id="refresh-btn" type="button" onclick="loadEscalations()">🔄 Refresh</button>
        </header>

        <div class="filter-tabs">
            <button class="tab-btn active" type="button" onclick="filterStatus('PENDING')">Pending Escalations</button>
            <button class="tab-btn" type="button" onclick="filterStatus('HUMAN_ACTIVE')">🧑‍💼 Active Human Chats</button>
            <button class="tab-btn" type="button" onclick="filterStatus('CLOSED')">Closed / Resolved</button>
            <button class="tab-btn" type="button" onclick="filterStatus(null)">All</button>
        </div>

        <div id="escalations-list"></div>
    </div>

    <script src="static/review.js"></script>
</body>
</html>
