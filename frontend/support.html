<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Support Dashboard</title>
    <link rel="stylesheet" href="static/support.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧑‍💼 Human Support Dashboard</h1>
            <div class="header-actions">
                <span class="active-count" id="active-count">0 active chats</span>
                <button id="refresh-btn" type="button" onclick="loadConversations()">🔄 Refresh</button>
                <a href="/review" class="link-debug">Developer View</a>
            </div>
        </header>

        <div class="filter-tabs">
            <button class="tab-btn active" type="button" onclick="filterStatus('PENDING')">New Requests</button>
            <button class="tab-btn" type="button" onclick="filterStatus('HUMAN_ACTIVE')">Active Chats</button>
            <button class="tab-btn" type="button" onclick="filterStatus('CLOSED')">Closed</button>
        </div>

        <div id="conversations-list" class="conversations-list"></div>
    </div>

    <script src="static/support.js"></script>
</body>
</html>
